[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "d11-team-builder"
version = "0.1.0"
description = "Dream11 Next-Gen Team Builder"
authors = [
    {name = "Antigravity", email = "antigravity@example.com"}
]
dependencies = [
    "pandas==2.2.2",
    "numpy==1.26.4",
    "pyarrow==16.1.0",
    "duckdb==1.0.0",
    "pyyaml==6.0.1",
    "requests==2.32.3",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
test = [
    "pytest==8.2.2"
]
